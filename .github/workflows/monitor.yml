name: Plingcast Comment Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 (UTC 기준, GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

# state.json 을 다시 커밋해야 하므로 저장소 쓰기 권한 필요
permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹치지 않도록 (state.json 충돌/중복 알림 방지)
concurrency:
  group: comment-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 댓글 1회 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python comment_bot.py   # URL 목록을 1회만 확인하고 종료

      # 확인 중 일부가 실패해도(always) 이미 보낸 알림 기록은 반드시 저장
      - name: state.json 변경 사항 커밋 & 푸시
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json 이 없습니다. 커밋할 내용 없음."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json 변경 없음 → 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update state.json [skip ci]"
          # 그 사이 다른 커밋(예: config.json 수정)이 올라왔을 수 있으므로 rebase 후 푸시, 최대 3번 재시도
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패, ${i}번째 재시도..."
            sleep 5
          done
          echo "state.json 푸시 실패"
          exit 1
